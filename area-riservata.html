<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Area Riservata - Night Riders</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .protected-section { max-width: 800px; margin: 40px auto; padding: 20px; text-align: center; }
    .login-box { background: rgba(0, 0, 0, 0.6); padding: 30px; border-radius: 8px; margin-top: 20px; }
    .login-box input[type="password"] { padding: 10px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; margin-right: 10px; }
    .login-box button { padding: 10px 20px; font-size: 16px; background-color: #f49529; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="bg-fixed"></div>
  <header>
    <div class="hero"><img src="img/hero.jpg" alt="Night Riders Hero"></div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="news/news1.html">News</a></li>
        <li><a href="gallery/gallery.html">Gallery</a></li>
        <li><a href="shop/shop.html">Shop</a></li>
        <li><a href="contatti.html">Contatti</a></li>
        <li><a href="storia.html">La nostra Storia</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="protected-section">
      <h2>Area Riservata</h2>

      <div class="login-box">
        <p>Inserisci la password per accedere ai documenti riservati:</p>
        <form onsubmit="checkPassword(event)">
          <input type="password" id="password-input" placeholder="Password" required>
          <button type="submit">Accedi</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    function checkPassword(event) {
      event.preventDefault(); 
      
      const inputPass = document.getElementById("password-input").value.trim();

      if (inputPass !== "") {
        
        window.location.href = "docs/" + inputPass + "/index.html";
      }
    }
  </script>
</body>
</html>
