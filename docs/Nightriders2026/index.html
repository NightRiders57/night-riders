<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documenti - Night Riders</title>
  <link rel="stylesheet" href="../../css/style.css"> 
  <style>
    .protected-section { max-width: 800px; margin: 40px auto; padding: 20px; text-align: center; }
    .file-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 15px; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #f49529; }
    .file-actions { display: flex; gap: 15px; align-items: center; }
    .download-btn { color: #f49529; text-decoration: none; font-weight: bold; }
    .delete-btn { color: #ff4d4d; background: none; border: 1px solid #ff4d4d; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 0.85em; }
    .delete-btn:hover { background: #ff4d4d; color: #fff; }
    
    .upload-box {
      background: rgba(0, 0, 0, 0.6);
      border: 1px dashed #f49529;
      padding: 25px;
      border-radius: 8px;
      margin-top: 40px;
      text-align: left;
    }
    .upload-box h3 { color: #f49529; margin-top: 0; }
    .upload-btn {
      padding: 10px 20px;
      background-color: #f49529;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    .upload-btn:disabled { background-color: #888; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="bg-fixed"></div>
  <main>
    <section class="protected-section">
      <h2>Area Riservata - Documenti</h2>

      <!-- LISTA DINAMICA FILE -->
      <div class="file-list">
        <h3>Documenti Disponibili</h3>
        <div id="fileContainer">
          <p style="color: #ccc;">Caricamento file in corso...</p>
        </div>
      </div>

      <!-- BOX UPLOAD FILE -->
      <div class="upload-box">
        <h3>Carica un nuovo file</h3>
        <p style="font-size: 0.9em; color: #ccc; margin-bottom: 15px;">
          Seleziona un file da aggiungere a questa cartella:
        </p>
        
        <input type="file" id="fileInput" accept=".pdf,.xlsx,.xls,.png,.jpg" style="color: #fff; display: block; margin-bottom: 10px;">
        <button id="uploadBtn" onclick="uploadViaServerless()" class="upload-btn">Carica Documento</button>

        <p id="statusMsg" style="margin-top: 15px; font-weight: bold;"></p>
      </div>

    </section>
  </main>

  <script>
    // Configurazione Endpoint Netlify 
    const NETLIFY_BASE_URL = "https://nightriders57.netlify.app";
    const TARGET_FOLDER = "docs/Nightriders2026";

    // 1. Carica automaticamente la lista dei file all'apertura della pagina
    document.addEventListener("DOMContentLoaded", fetchFileList);

    async function fetchFileList() {
      const container = document.getElementById('fileContainer');
      try {
        // Legge il contenuto della cartella da GitHub tramite API pubblica
        const res = await fetch(`https://api.github.com/repos/NightRiders57/night-riders/contents/${TARGET_FOLDER}`);
        
        if (!res.ok) {
          container.innerHTML = "<p style='color:#ff4d4d;'>Impossibile caricare i file.</p>";
          return;
        }

        const files = await res.json();
        container.innerHTML = "";

        // Filtra escludendo l'index.html stesso o cartelle
        const documentFiles = files.filter(f => f.type === 'file' && f.name !== 'index.html');

        if (documentFiles.length === 0) {
          container.innerHTML = "<p style='color:#ccc;'>Nessun documento presente.</p>";
          return;
        }

        documentFiles.forEach(file => {
          const item = document.createElement('div');
          item.className = 'file-item';
          item.innerHTML = `
            <span>📄 ${file.name}</span>
            <div class="file-actions">
              <a href="${file.name}" class="download-btn" download>Scarica</a>
              <button class="delete-btn" onclick="deleteFile('${file.name}')">Elimina</button>
            </div>
          `;
          container.appendChild(item);
        });

      } catch (err) {
        container.innerHTML = "<p style='color:#ff4d4d;'>Errore nel caricamento della lista.</p>";
      }
    }

    // 2. Funzione per caricare un file
    async function uploadViaServerless() {
      const fileInput = document.getElementById('fileInput');
      const statusMsg = document.getElementById('statusMsg');
      const uploadBtn = document.getElementById('uploadBtn');

      if (fileInput.files.length === 0) {
        statusMsg.style.color = "#ff4d4d";
        statusMsg.innerText = "Seleziona un file prima di procedere!";
        return;
      }

      const file = fileInput.files[0];
      uploadBtn.disabled = true;
      statusMsg.style.color = "#f49529";
      statusMsg.innerText = "Caricamento in corso...";

      try {
        const base64Content = await convertFileToBase64(file);

        const response = await fetch(`${NETLIFY_BASE_URL}/.netlify/functions/upload`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            fileName: file.name,
            fileBase64: base64Content,
            folder: TARGET_FOLDER
          })
        });

        const result = await response.json();

        if (response.ok) {
          statusMsg.style.color = "#4CAF50";
          statusMsg.innerText = "File caricato con successo!";
          fileInput.value = "";
          fetchFileList(); // RIAGGIORNA LA LISTA A SCHERMO
        } else {
          statusMsg.style.color = "#ff4d4d";
          statusMsg.innerText = "Errore: " + (result.error || "Impossibile caricare.");
        }

      } catch (err) {
        statusMsg.style.color = "#ff4d4d";
        statusMsg.innerText = "Errore connessione: " + err.message;
      } finally {
        uploadBtn.disabled = false;
      }
    }

    // 3. Funzione per eliminare un file
    async function deleteFile(fileName) {
      if (!confirm(`Sei sicuro di voler eliminare il file "${fileName}"?`)) return;

      try {
        const response = await fetch(`${NETLIFY_BASE_URL}/.netlify/functions/delete`, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            fileName: fileName,
            folder: TARGET_FOLDER
          })
        });

        const result = await response.json();

        if (response.ok) {
          alert("File eliminato!");
          fetchFileList(); // RIAGGIORNA LA LISTA A SCHERMO
        } else {
          alert("Errore nell'eliminazione: " + (result.error || "Errore sconosciuto"));
        }
      } catch (err) {
        alert("Errore di connessione: " + err.message);
      }
    }

    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
